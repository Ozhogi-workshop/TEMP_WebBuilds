<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Obby Parkour 3D Run Only Up</title>
    <!-- YouTube Playables SDK: MUST load before any game code
         (https://developers.google.com/youtube/gaming/playables/reference/getting_started). -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #231F20; }
      /* Fills the Playables frame at any aspect ratio and follows its resizes (requirements_design §1). */
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; background: #231F20; touch-action: none; }
      /* Download progress until the engine starts; the game's own loading screen (which calls firstFrameReady) takes over. */
      #yt-loading { position: fixed; left: 50%; top: 50%; width: min(60vw, 360px); transform: translate(-50%, -50%); text-align: center; font-family: sans-serif; color: #fff; pointer-events: none; }
      #yt-loading-track { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.25); overflow: hidden; }
      #yt-loading-fill { height: 100%; width: 0%; border-radius: 5px; background: #fff; transition: width 0.15s linear; }
      #yt-loading-text { margin-top: 10px; font-size: 14px; opacity: 0.85; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="yt-loading" aria-live="polite">
      <div id="yt-loading-track"><div id="yt-loading-fill"></div></div>
      <div id="yt-loading-text">Loading…</div>
    </div>
    <script>
      // Kept for the Google Unity wrapper sample, which expects this global (samples/unity_wrapper).
      var unityGameInstance = null;
      (function () {
        var canvas = document.getElementById("unity-canvas");
        var loading = document.getElementById("yt-loading");
        var fill = document.getElementById("yt-loading-fill");
        var text = document.getElementById("yt-loading-text");

        var script = document.createElement("script");
        script.src = "Build/473105615307fbc9dfa345e0bc71ea6c.loader.js"; // relative path only (requirements_stability)
        script.onload = function () {
          createUnityInstance(canvas, {
            arguments: [],
            dataUrl: "Build/93e7f84926c87472bf492bdd0e060a4c.data",
            frameworkUrl: "Build/3b549c579393c0723fa78a4db17ab0b5.framework.js",
            codeUrl: "Build/ffeeb616188a93f0f8d12e27df57c2ca.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Evgeniya Senchurova",
            productName: "Obby Parkour 3D Run Only Up",
            productVersion: "3.1.0",
          }, function (progress) {
            fill.style.width = Math.round(progress * 100) + "%";
          }).then(function (unityInstance) {
            unityGameInstance = unityInstance;
            loading.style.display = "none";
          }).catch(function (message) {
            // No alert/popup: show the error in place.
            text.textContent = "Could not start the game.";
            console.error(message);
          });
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
